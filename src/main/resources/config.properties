# ================================
# Browser Configuration
# ================================
# Supported values: chrome, firefox, edge
browser=chrome
env=qa

qa.url=https://qa.example.com
uat.url=https://uat.example.com
prod.url=https://prod.example.com


# ================================
# Application Configuration
# ================================
# Base URL of the application under test
baseUrl=https://opensource-demo.orangehrmlive.com/web/index.php/auth/login

# ================================
# Wait Configuration (in seconds)
# ================================
# Implicit wait applied globally to WebDriver
implicitWait=10

# Explicit wait value (to be used in WaitUtils later)
explicitWait=10

# ================================
# Execution Configuration
# ================================
# Run browser in headless mode (true/false)
headless=false
